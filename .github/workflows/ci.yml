name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "codex/**"

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-vie \
            libpq-dev

      - name: Install backend dependencies
        working-directory: src/backend
        run: python -m pip install -e .[dev]

      - name: Run backend tests
        working-directory: src/backend
        env:
          REDLINE_ENVIRONMENT: test
          REDLINE_UPLOAD_STORAGE_BACKEND: local
        run: python -m pytest tests -q

  postgres-migration-smoke:
    name: Postgres pgvector migration smoke
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: redline
          POSTGRES_USER: redline
          POSTGRES_PASSWORD: redline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U redline -d redline"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: src/backend
        run: python -m pip install -e .[dev]

      - name: Apply Alembic migrations on pgvector
        working-directory: src/backend
        env:
          REDLINE_ENVIRONMENT: test
          REDLINE_DATABASE_URL: postgresql+psycopg://redline:redline@127.0.0.1:5432/redline
          REDLINE_UPLOAD_STORAGE_BACKEND: local
          REDLINE_RAG_EMBEDDING_PROVIDER: local-hash
        run: |
          python -m alembic upgrade head
          python -m alembic current
          python -m app.rag_admin health --strict

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: src/frontend
        run: npm run test -- --run

      - name: Build frontend
        working-directory: src/frontend
        run: npm run build
