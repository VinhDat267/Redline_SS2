[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redline-backend"
version = "0.1.0"
description = "FastAPI backend for the Redline document review application"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16,<2.0",
  "boto3>=1.35,<2.0",
  "fastapi>=0.118,<1.0",
  "google-auth>=2.35,<3.0",
  "httpx>=0.28,<1.0",
  "pgvector>=0.4,<1.0",
  "Pillow>=11.0,<12.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.10,<3.0",
  "pymupdf>=1.24,<2.0",
  "pytesseract>=0.3.13,<0.4",
  "python-docx>=1.2,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "requests>=2.32,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn>=0.37,<1.0",
  "gunicorn>=23.0,<24.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.1,<7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
